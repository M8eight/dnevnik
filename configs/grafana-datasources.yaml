apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: loki
          matcherRegex: '"traceId":"(\w+)"'
          name: traceId
          url: '{app=~"api-gateway|user-service|academic-service"} | traceId="$${__value.raw}"'
          urlDisplayLabel: "Показать весь запрос"

providers:
  - name: default
    folder: dnevnik
    type: file
    options:
      path: /etc/grafana/provisioning/dashboards/json
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s
server:
  port: 8080

spring:
  reactor:
    context-propagation: auto
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_PUBLIC_URL:http://localhost:9090}/realms/${KC_REALM:dnevnik-realm}
          jwk-set-uri: ${KC_URL:http://localhost:9090}/realms/${KC_REALM:dnevnik-realm}/protocol/openid-connect/certs

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user-service/**
          filters:
            - TokenRelay=
        - id: academic-service
          uri: lb://academic-service
          predicates:
            - Path=/academic-service/**
          filters:
            - TokenRelay=

springdoc:
  swagger-ui:
    urls:
      - name: "User service"
        url: /user-service/v3/api-docs
      - name: "Academic service"
        url: /academic-service/v3/api-docs
  api-docs:
    path: /v3/api-docs

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

eureka:
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://user:password@localhost:8761/eureka/}

logging:
  file:
    path: ${LOGS_PATH:./logs}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
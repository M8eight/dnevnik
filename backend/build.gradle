plugins {
	id 'org.springframework.boot' version '3.4.2' apply false
	id 'io.spring.dependency-management' version '1.1.5' apply false
	id 'java'
}

allprojects {
	apply plugin: 'java'

	group = 'com.rusobr'
	version = '0.1'
	description = 'Backend microservices school system'
	sourceCompatibility = JavaVersion.VERSION_17

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

tasks.named('test', Test) {
        exclude '**/*TestSuite.class'

        useJUnitPlatform {
            excludeTags 'integration'
        }
    }

    tasks.register('suiteTest', Test) {
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath

        exclude '**/*IntegrationTestSuite.class'
        include '**/*TestSuite.class'

        useJUnitPlatform {
            excludeTags 'integration'
        }
    }

    tasks.register('suiteIntegrationTest', Test) {
        group = 'verification'

        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath

        include '**/*IntegrationTestSuite.class'

        useJUnitPlatform {
            includeTags 'integration'
        }

        shouldRunAfter test
    }

    tasks.register('integrationTest', Test) {
        group = 'verification'
        description = 'Runs integration tests'

        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath

        exclude '**/*TestSuite.class'

        useJUnitPlatform {
            includeTags 'integration'
        }

        shouldRunAfter test
    }

    tasks.named('check') {
        dependsOn integrationTest
    }

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.2"
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.2"
		}
	}

	tasks.withType(Test).configureEach {
		testLogging {
			events "passed", "skipped", "failed"
			showExceptions true
			exceptionFormat "full"
			showCauses true
			showStackTraces true
		}
	}
}
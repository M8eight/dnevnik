name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [eureka-server, api-gateway, user-service, academic-service]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        working-directory: backend
        run: chmod +x gradlew

      - name: Run tests
        working-directory: backend
        # Предполагается плоский multi-project build Gradle,
        # где модуль-подпроект называется так же, как сервис (":eureka-server", ":api-gateway" и т.д.)
        run: ./gradlew :${{ matrix.service }}:test --no-daemon

  backend-build-image:
    name: Build backend image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: backend-test
    strategy:
      fail-fast: false
      matrix:
        service: [eureka-server, api-gateway, user-service, academic-service]
    steps:
      - uses: actions/checkout@v7

      - name: Make gradlew executable in build context
        working-directory: backend
        run: chmod +x gradlew

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-validate:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: docker compose config -q